[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryflow-batch-integration"
version = "0.1.0"
description = "Production-grade batch ingestion for FactoryFlow MX."
requires-python = ">=3.12,<3.14"
dependencies = [
  "psycopg[binary]>=3.3.5,<3.4",
  "psycopg-pool>=3.3.1,<3.4"
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120",
  "jsonschema[format]>=4.23",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--showlocals",
  "--verbose"
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["factoryflow_batch"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP"
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[project.scripts]
factoryflow-p01-migrate = "factoryflow_batch.entrypoints.migrate_postgres:main"
