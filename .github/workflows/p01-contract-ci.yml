name: P01 Quality CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p01-contract-ci.yml"
      - "projects/p01-batch-integration/**"
      - "shared/contracts/jsonschema/batch/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p01-contract-ci.yml"
      - "projects/p01-batch-integration/**"
      - "shared/contracts/jsonschema/batch/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  P01_PROJECT_DIR: projects/p01-batch-integration
  P01_TEST_DATABASE_URL: postgresql://factoryflow_test:factoryflow_ci@127.0.0.1:5432/factoryflow_p01_test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality-gate:
    name: Contracts, PostgreSQL and application
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: factoryflow_p01_test
          POSTGRES_USER: factoryflow_test
          POSTGRES_PASSWORD: factoryflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready -U factoryflow_test -d factoryflow_p01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/p01-batch-integration/requirements-dev.lock

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install \
            --requirement "${P01_PROJECT_DIR}/requirements-dev.lock"

          python -m pip install \
            --no-deps \
            --editable "${P01_PROJECT_DIR}"

      - name: Run P01 quality gate
        shell: bash
        run: |
          "./${P01_PROJECT_DIR}/scripts/postgres-quality-gate.sh"
