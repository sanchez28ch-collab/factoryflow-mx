name: P01 Quality CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p01-contract-ci.yml"
      - "projects/p01-batch-integration/**"
      - "shared/contracts/jsonschema/batch/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p01-contract-ci.yml"
      - "projects/p01-batch-integration/**"
      - "shared/contracts/jsonschema/batch/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  P01_PROJECT_DIR: projects/p01-batch-integration
  FF_ENV_FILE: infrastructure/local/.env
  FF_COMPOSE_FILE: infrastructure/local/compose.yaml
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality-gate:
    name: Contracts, PostgreSQL, Kafka and application
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/p01-batch-integration/requirements-dev.lock

      - name: Verify runner tools
        shell: bash
        run: |
          docker version
          docker compose version

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

          shellcheck --version

      - name: Create ephemeral integration environment
        shell: bash
        run: |
          cp infrastructure/local/.env.example "${FF_ENV_FILE}"
          chmod 600 "${FF_ENV_FILE}"

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install \
            --requirement "${P01_PROJECT_DIR}/requirements-dev.lock"

          python -m pip install \
            --no-deps \
            --editable "${P01_PROJECT_DIR}"

      - name: Validate scripts and Compose
        shell: bash
        run: |
          shellcheck \
            "${P01_PROJECT_DIR}/scripts/quality-gate.sh" \
            "${P01_PROJECT_DIR}/scripts/postgres-quality-gate.sh"

          docker compose \
            --env-file "${FF_ENV_FILE}" \
            --file "${FF_COMPOSE_FILE}" \
            config --quiet

      - name: Pull integration images
        shell: bash
        run: |
          docker compose \
            --env-file "${FF_ENV_FILE}" \
            --file "${FF_COMPOSE_FILE}" \
            pull

      - name: Start PostgreSQL and Kafka
        shell: bash
        run: |
          docker compose \
            --env-file "${FF_ENV_FILE}" \
            --file "${FF_COMPOSE_FILE}" \
            up --detach --wait --wait-timeout 300

      - name: Run P01 integrated quality gate
        shell: bash
        run: |
          "./${P01_PROJECT_DIR}/scripts/postgres-quality-gate.sh"

      - name: Collect failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts

          docker compose \
            --env-file "${FF_ENV_FILE}" \
            --file "${FF_COMPOSE_FILE}" \
            ps --all > artifacts/compose-ps.txt 2>&1 || true

          docker compose \
            --env-file "${FF_ENV_FILE}" \
            --file "${FF_COMPOSE_FILE}" \
            logs --no-color --timestamps \
            > artifacts/compose.log 2>&1 || true

          docker version \
            > artifacts/docker-version.txt 2>&1 || true

          docker compose version \
            > artifacts/docker-compose-version.txt 2>&1 || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: p01-quality-failure-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up integration platform
        if: always()
        shell: bash
        run: |
          if [[ -f "${FF_ENV_FILE}" ]]; then
            docker compose \
              --env-file "${FF_ENV_FILE}" \
              --file "${FF_COMPOSE_FILE}" \
              down --volumes --remove-orphans || true
          fi
